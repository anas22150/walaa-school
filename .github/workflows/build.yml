name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. تثبيت إصدار محدد من Flet لتجنب مشاكل الإصدارات
      - name: Install specific Flet version
        run: |
          pip install "flet==0.28.0"

      # 2. إعداد Android SDK يدويًا (لتجنب مشاكل التراخيص)
      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      # 3. قبول التراخيص
      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      # 4. تشغيل البناء مباشرة بأمر flet
      - name: Build APK
        run: |
          flet build apk
        env:
          FLET_CLI_LOG_FORMAT: "plain"   # عشان يطبع نص عادي بدون رموز تسبب مشاكل

      # 5. رفع الملف الناتج
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: walaa-apk
          path: build/apk/*.apk
          retention-days: 30
