name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK with Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
        env:
          FLET_CLI_NO_RICH_OUTPUT: "1"
          FLET_CLI_LOG_FORMAT: "plain"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: walaa-apk
          path: ${{ steps.build.outputs.archive-path }}
