workflows:
  android-build:
    name: Build Flet Android APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      python: 3.12
    scripts:
      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip3 install flet
      - name: Build APK
        script: |
          flet build apk --verbose
    artifacts:
      - build/apk/*.apk
