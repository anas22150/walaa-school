workflows:
  android-build:
    name: Build Flet Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flet
        script: |
          pip3 install flet
      - name: Build APK
        script: |
          flet build apk --verbose
    artifacts:
      - build/apk/*.apk
